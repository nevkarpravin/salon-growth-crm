spring:
  application:
    name: salon-growth-crm
  datasource:
    url: jdbc:h2:mem:saloncrm;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

crm:
  seed: true
  segments:
    new-days: 30
    at-risk-min-days: 45
    at-risk-max-days: 60
    lapsed-days: 60
    vip-spend: 20000
    vip-visits: 10

springdoc:
  swagger-ui:
    path: /swagger-ui.html
