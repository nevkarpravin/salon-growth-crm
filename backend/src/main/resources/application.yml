spring:
  application:
    name: salon-growth-crm
  datasource:
    url: jdbc:h2:mem:saloncrm;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

crm:
  seed: true
  segments:
    new-days: 30
    at-risk-min-days: 45
    at-risk-max-days: 60
    lapsed-days: 60
    vip-spend: 20000
    vip-visits: 10
  virtual-room:
    salon-name: ${VIRTUAL_ROOM_SALON_NAME:Glow Salon}
    notify-at-position: 2
    requeue-positions: 2
    max-skips: 2
    presence-timeout-minutes: 5
    review-delay-minutes: 0
    google-review-url: ${GOOGLE_REVIEW_URL:}
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
    payments:
      upi-id: ${UPI_ID:glowsalon@upi}
      payee-name: ${UPI_PAYEE_NAME:Glow Salon}
    whatsapp:
      provider: ${WHATSAPP_PROVIDER:LOG}
      access-token: ${WHATSAPP_ACCESS_TOKEN:}
      phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
      verify-token: ${WHATSAPP_VERIFY_TOKEN:salon-verify}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
